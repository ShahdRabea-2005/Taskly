name: taskly
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # حزم الحالة والـ State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.2
  
  # حزم التخزين المحلي (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # حزم Firebase (لربط السحاب والبيانات)
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

